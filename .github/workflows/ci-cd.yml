name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # STAGE 1: TỰ ĐỘNG CHẠY TEST BACKEND & FRONTEND
  # ==========================================
  backend-ci:
    name: 🧪 Backend Unit Test (Spring Boot)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Backend Unit Tests
      run: |
        cd backend
        mvn clean test

  frontend-ci:
    name: 🧪 Frontend Build Verify (React + Vite)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies & Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build

  # ==========================================
  # STAGE 2: BUILD & PUSH DOCKER IMAGES LÊN DOCKER HUB
  # (Tự động chạy khi Test ở Stage 1 thành công 100%)
  # ==========================================
  build-and-push-docker:
    name: 🐳 Build & Push Docker Images to Docker Hub
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build & Push Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/nhatro-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/nhatro-backend:${{ github.sha }}

    - name: Build & Push Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/nhatro-frontend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/nhatro-frontend:${{ github.sha }}

  # ==========================================
  # STAGE 3: TỰ ĐỘNG DEPLOY TRÊN WSL (SELF-HOSTED RUNNER)
  # ==========================================
  deploy-to-wsl:
    name: 🚀 Auto Deploy on WSL (Self-Hosted Runner)
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Pull Latest Docker Images
      run: |
        cd ~/docker-test || true
        docker compose pull

    - name: Deploy Containers with Docker Compose
      run: |
        cd ~/docker-test || true
        docker compose up -d --remove-orphans
        docker image prune -f


