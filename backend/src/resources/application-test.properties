# Cấu hình Cơ sở dữ liệu chạy Test (H2 Database in-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Khóa bí mật và phân quyền giả định phục vụ test
jwt.secret=DauAnCuaNhaTroQuangSieuBaoMatKhongTheBiHackerPhaDuoc123!!!
jwt.expiration=86400000
cors.allowed.origins=*
oauth2.redirect.uri=http://localhost:5173/oauth2/redirect

# Google OAuth2 giả định
spring.security.oauth2.client.registration.google.client-id=mock-client-id
spring.security.oauth2.client.registration.google.client-secret=mock-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email

# Cấu hình Mail giả định để tránh gửi mail thật khi test
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mock@gmail.com
spring.mail.password=mock-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
